[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "au-hikari-conditions"
version = "0.1.0"
description = "auひかり条件表更新・配信管理システム"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"pypdf>=5.9,<6",
	"openpyxl>=3.1,<4",
	"python-docx>=1.2,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
